plugins:
  ModelRequester:
    OpenAICompatible:
      base_url: "${ENV.DEEPSEEK_BASE_URL}"
      model: "${ENV.DEEPSEEK_DEFAULT_MODEL}"
      auth: "${ENV.DEEPSEEK_API_KEY}"
      model_type: chat
      stream: false
      request_retry:
        max_attempts: 2
        after_output: true
      request_options:
        temperature: 0
        max_tokens: 8192
        thinking:
          type: disabled

