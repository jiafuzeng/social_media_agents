.execution:
  input:
    package: ${package}
  info:
    snapshot: ${info}
  instruct:
    - 对齐矩阵口径，只能评审已有 draft_key。
    - 不得把 skip 或 template_fallback 改回可发正文。
    - revise 只允许收紧表述，不能放宽硬门。
  output:
    $format: json
    item_verdicts:
      $type:
        - draft_key:
            $type: str
            $ensure: not_null
          verdict:
            $type: str
            $desc: accept、revise 或 reject
            $ensure: not_null
          revised_text:
            $type: str
          notes:
            $type: str
    package_summary:
      $type: str
      $ensure: not_null
    limitations:
      $type:
        - $type: str
