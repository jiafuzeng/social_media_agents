.execution:
  input:
    package: ${package}
  info:
    snapshot: ${info}
  instruct:
    - 只输出 item_verdicts、package_summary、limitations，不要额外字段。
    - 对齐官方语气，只能评审已有 draft_key。
    - verdict 只能是 accept、revise 或 reject。
    - 不得把 skip 改回可发回复，也不得放宽 template_fallback。
    - 攻击项必须保持空正文。
  output:
    $format: json
    item_verdicts:
      $type:
        - draft_key:
            $type: str
            $ensure: not_null
          verdict:
            $type: str
            $ensure: not_null
          revised_text:
            $type: str
          notes:
            $type: str
    package_summary:
      $type: str
      $ensure: not_null
    limitations:
      $type:
        - $type: str
