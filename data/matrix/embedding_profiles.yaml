# 知识库 embeddings Agent。密钥/地址走 env，不要把写稿 DeepSeek 配进这里。
default: bge-m3
profiles:
  openai-small:
    label: OpenAI 3 small
    base_url: ${ENV.EMBEDDING_OPENAI_BASE_URL}
    api_key: ${ENV.EMBEDDING_OPENAI_API_KEY}
    model: text-embedding-3-small
  bge-m3:
    label: BGE-M3
    base_url: ${ENV.EMBEDDING_BGE_BASE_URL}
    auth: ${ENV.EMBEDDING_BGE_AUTH}
    model: bge-m3
  qwen3:
    label: Qwen3 Embedding 0.6b
    base_url: ${ENV.EMBEDDING_QWEN_BASE_URL}
    auth: ${ENV.EMBEDDING_QWEN_AUTH}
    model: qwen3-embedding:0.6b
