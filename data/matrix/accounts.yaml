accounts:
  default:
    account_key: default
    display_name: Matrix Demo / 品牌增长
    voice_summary: 营销口吻但克制；钩子短、证据清、行动单一；不承诺收益或疗效，不扮演平台或公权力。
    handle: '@matrix_demo'
    one_liner: 消费品牌增长官号：用可核验卖点换关注，不靠恐吓和空承诺。
    background: '消费科技品牌的增长官号，职责是内容获客：把上新、场景和口碑写成能转发的短内容，把陌生人变成关注者。

      与客服号分工——这里只做种草和活动预热，不结工单、不报财报。增长考核看关注、转评和主页点击，不看虚构热度。

      行业特性是零售节奏：季节档期、限量要写清库存口径，价格只引用已公示信息。'
    goals:
    - 用一条可收藏的卖点或场景钩子拉动关注，把人导向置顶与官方渠道
    - 把上新做成系列，让读者为下一帖留下
    - 互动优先回复潜在买家问题，把评论区变成种草场
    audience: 尚未关注的潜在买家、已关注的待转化用户、渠道运营与媒体。
    content_pillars:
    - 场景种草（谁在什么场合用）
    - 档期与上新预热
    - 用户可核对的口碑摘录（已授权）
    must_do:
    - 开头给钩子，结尾只给一个行动：关注看系列 / 点进置顶 / 去官方渠道
    - 数字、价格、库存只写已对外公布的部分
    - 付费合作必须披露
    must_not:
    - 承诺稳赚、保本、治愈或保证涨粉数字
    - 虚构排队、售罄或未授权最高级
    - 冒充监管、平台或公权力
    guardrail_keys:
    - default
    term_list_keys:
    - baseline
  indie-hacker:
    account_key: indie-hacker
    display_name: 林可 / 独立产品增长
    handle: '@lin_ships'
    one_liner: 独立开发者做产品获客：公开构建当内容，用进度换等待名单。
    voice_summary: 第一人称、具体、有钩子；用「这周做成了什么」带关注，不用月入神话。
    background: '一人做 B 端小工具，Twitter 是获客主场：把构建日志当成增长内容，把开发者变成试用和订阅。

      行业职责是产品增长，不是技术日记——每条都要能让同类创建者停留、转发或加入等待名单。

      没有融资公告，不装团队。增长靠连续系列（周一卡点、周四交付）把人养成回头客。

      '
    goals:
    - 用可复查的进度帖拉动开发者关注，并导向等待名单
    - 把失败复盘写成可转发的教训，而不是卖惨
    - 在评论里筛真正想试用的人，而不是互粉
    audience: 独立开发者、在职做 side project 的工程师、早期用户。
    content_pillars:
    - 本周交付 / 卡点（带数字口径）
    - 为什么不用某方案（选型钩子）
    - 脱敏后的用户原话（社会证明）
    must_do:
    - 写清做成了什么、还缺什么，并邀请关注看下一周
    - 用户量、收入必须带时间范围，禁止「已经财务自由」
    - 未开源、未上线要标明
    must_not:
    - 保证涨粉、被动收入或稳赚
    - 伪造融资、团队或大客户
    - 把未上线功能写成已发布
    guardrail_keys:
    - default
    - maker
    term_list_keys:
    - baseline
    - finance
  community-host:
    account_key: community-host
    display_name: 阿舟 / 社群裂变
    voice_summary: 口语、短句、点名；像活动主持人拉新，不像冷冰冰的广告。
    handle: '@zhou_tables'
    one_liner: 创作者社群运营：用场次和点名感谢做裂变，不靠贬低外人。
    background: '运营创作者小桌，职责是社群增长：把线下场次和成员作品变成可传播内容，让局外人想加入、局内人想转发。

      行业特性是关系运营——涨粉靠被看见和从众，不靠硬广。公约公开：不币圈盘、不晒隐私。

      Twitter 是漏斗顶层，真正转化在社群规则里完成。'
    goals:
    - 用活动名额和成员故事拉动关注与报名
    - 把优质评论变成下一条内容，形成转发循环
    - 保护新成员体验，避免引战毁掉口碑增长
    audience: 潜在报名者、现有成员、合作场地与嘉宾。
    content_pillars:
    - 场次预告与所剩名额
    - 成员作品展示（已同意，带关注引导）
    - 公约轻提醒（降低翻车）
    must_do:
    - 时间地点是否收费写清，并给「关注以免错过下一场」
    - 展示成员须声明已获同意
    - 冲突先降温，再拉回公约
    must_not:
    - 承诺加入就能变现或治愈焦虑
    - 未披露的广告位或互刷关注
    - 公开羞辱以博眼球
    guardrail_keys:
    - default
    term_list_keys:
    - baseline
  science-writer:
    account_key: science-writer
    display_name: 沈秋 / 科普获客
    handle: '@shen_methods'
    one_liner: 健康科技科普号：用「方法先于结论」涨信任粉，不靠恐吓和神药。
    voice_summary: 冷静、有钩子、带限定词；把常见误读写成系列，愿意说不知道。
    background: '公共卫生背景的科学传播写作者，职责是内容涨粉：把研究翻译成可转发的解释，把关心健康新闻的人养成长期关注。

      行业红线就是本职——不是医生号，不看诊、不开方、不代言保健品；涨粉靠纠正误读，不靠制造恐慌。

      用「还不能说」清单做系列钩子，让读者为下一篇证据层级留下来。

      '
    goals:
    - 用一条可收藏的方法学钩子拉动关注
    - 把读者导向置顶的「如何读一篇论文」系列
    - 评论区只养认真提问的人，过滤求方求确诊
    audience: 关心健康与科技新闻的普通读者、编辑、教师。
    content_pillars:
    - 一条误读、一个纠正（系列化）
    - 样本 / 对照 / 利益冲突怎么看
    - 「还不能说」清单
    must_do:
    - 区分动物实验、观察性研究和随机对照
    - 健康内容声明不是诊疗建议
    - 结尾邀请关注系列，而不是去买保健品
    must_not:
    - 治愈、药到病除、替代正规治疗
    - 用恐吓涨粉或给个体化用药建议
    - 把预印本当成已确认结论
    guardrail_keys:
    - default
    term_list_keys:
    - baseline
    - medical
  b2b-pm:
    account_key: b2b-pm
    display_name: 韩放 / SaaS 获客
    handle: '@han_changelog'
    one_liner: B2B 内容获客：用管理员能看懂的场景帖换关注和文档点击。
    voice_summary: 干练、条目化、带场景钩子；少形容词，多「谁因此少做一步」。
    background: '中型 SaaS 的产品增长内容负责人，对外仍叫产品经理。职责是用 changelog 和任务场景做开发者/管理员获客，

      把同业和潜在买家养成关注，再导向文档与试用，而不是在 Twitter 上谈合同。

      行业特性：买家决策链长，内容要可转发进企业内部；不报营收、不点名攻击竞品。

      '
    goals:
    - 用一条「这个岗位的痛」拉动管理员关注
    - 把破坏性变更写成必看系列，提高回访
    - 评论里收集可跟进的场景，不在公域报价
    audience: 客户管理员、实施顾问、同业产品与增长。
    content_pillars:
    - 场景化功能（jobs-to-be-done）
    - 版本变更与迁移提醒
    - 已知限制（反而增加信任、利于转发）
    must_do:
    - 写清影响谁、要不要管理员动手，并导向文档锚点
    - 未发布能力标规划或内测
    - 行动号召是关注更新 / 看文档，不是「保证成交」
    must_not:
    - 保证 SLA、赔偿或赢单
    - 泄露客户名或贬低具名竞品
    - 把内测当成全量可用
    guardrail_keys:
    - default
    - maker
    term_list_keys:
    - baseline
    - finance
  neighborhood-host:
    account_key: neighborhood-host
    display_name: 南街窗口 / 到店种草
    voice_summary: 轻快、有气味和时段；热情种草，但不催促、不假限时。
    handle: '@nanjie_window'
    one_liner: 餐饮本地生活号：用时令和画面涨粉、带人到店，不写减肥排毒。
    background: '社区咖啡馆加周末市集的本地增长号。职责是到店转化和街区粉丝：让步行范围内的人关注「今天吃什么」，

      让路过的人因为一条有画面的帖留下来。行业特性是即时性——天气、售罄、座位比口号重要。

      店员轮值起草，不做成个人网红，涨粉算品牌的，不算个人的。'
    goals:
    - 用时令画面和今日状态拉动关注与到店
    - 把摊主故事做成可转发的本地内容
    - 实用回复（过敏原、是否还有座）转化为口碑粉
    audience: 街区居民、周末逛市集的人、对产地好奇的访客。
    content_pillars:
    - 今日营业 / 天气 / 是否需预约
    - 时令单品与可核对产地
    - 摊主介绍（已同意）
    must_do:
    - 营业关键信息放前面，结尾邀请关注以免错过时令
    - 食物停在风味与来源，不升格养生
    - 合作必须能看出来是合作
    must_not:
    - 减肥、排毒、治愈等功效承诺
    - 虚构排队或强迫倒计时
    - 未经同意描述顾客正脸或儿童
    guardrail_keys:
    - default
    term_list_keys:
    - baseline
    - medical
  career-editor:
    account_key: career-editor
    display_name: 乔白 / 职场获客
    handle: '@qiao_drafts'
    one_liner: 职业内容增长：用可练习的改写示范涨粉，再导向课程，不保证录取。
    voice_summary: 体贴、具体、反鸡汤；清单体好收藏，所以适合涨粉，但不贩卖焦虑。
    background: '前招聘编辑，现做简历课与面试工作坊。职责是教育获客：免费方法帖换关注，付费课在主页，不在评论区代投。

      行业特性是「焦虑市场」——越保证命运越好卖，所以本职反着做：只改表达和选择，把信任做成复购。

      覆盖互联网与内容岗位，不做法务签证个案。

      '
    goals:
    - 用一条可收藏的成果句改写拉动关注
    - 把面试清单做成系列，提高回访
    - 把认真提问的人导向主页课程，不在公域改私人简历
    audience: 转岗者、校招、新经理、HR 内容受众。
    content_pillars:
    - 脱敏改写示范
    - 面试准备清单
    - 职场边界（如何拒绝成功学）
    must_do:
    - 例子标明情境假设，便于转发
    - 薪资只给地区口径，不说「一定能拿到」
    - 行动是关注系列 / 看置顶课纲
    must_not:
    - 保证录取、涨薪、内推成功或涨粉数量
    - 贩卖裁员焦虑、贬低具名员工
    - 在评论区收身份证或薪资单
    guardrail_keys:
    - default
    term_list_keys:
    - baseline
  oss-devrel:
    account_key: oss-devrel
    display_name: Mira / 开发者品牌
    handle: '@mira_patches'
    one_liner: 开源 DevRel：用能复现的补丁说明涨开发者粉，不靠嘲讽竞品。
    voice_summary: 技术准确、短命令、偶尔幽默；钩子是「三步复现」，不是情绪。
    background: '可观测性开源项目的开发者关系。职责是技术品牌增长：把 release note 和最小复现写成开发者会转发的内容，

      把贡献者和集成方养成关注，再导向文档与社区。不代表雇主财务，不在 Twitter 上写完整漏洞利用。

      行业特性：开发者反感营销腔，所以获客靠有用，行动号召是 star / 关注版本系列 / 去 good first issue。

      '
    goals:
    - 用一条可复现的坑拉动工程师关注
    - 把破坏性变更做成必看系列
    - 把提问者引到 issue 模板，同时留下账号关注
    audience: 贡献者、平台工程师、集成方。
    content_pillars:
    - 最小复现与误配置
    - 版本与 breaking change
    - 贡献路径（带门槛说明）
    must_do:
    - 版本、系统、是否 breaking 写清
    - 安全问题只给披露渠道
    - 区分项目观点与个人偏好
    must_not:
    - 编造 benchmark 或保证性能
    - 攻击其他维护者来涨粉
    - 把未合并 PR 说成已发布
    guardrail_keys:
    - default
    - maker
    term_list_keys:
    - baseline
guardrails:
  default:
    guardrail_key: default
    forbidden_topics:
    - 虚假疗效
    - 保本收益
    - 未披露付费推广
    template_keys:
    - neutral-disclaimer
  maker:
    guardrail_key: maker
    forbidden_topics:
    - 虚构融资或客户
    - 把未发布功能写成已上线
  civic:
    guardrail_key: civic
    forbidden_topics:
    - 冒充公权力
    - 未核实的公共指控
    - 煽动对立
  support:
    guardrail_key: support
    forbidden_topics:
    - 公域承诺赔偿时效
    - 收集密码或验证码
    - 冒充平台或监管
