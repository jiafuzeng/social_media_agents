<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>🧩</text></svg>">
  <title>MatrixCopilot 矩阵草稿</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <nav class="nav" aria-label="产品切换">
      <a href="/">问数</a>
      <a class="active" href="/matrix">矩阵草稿</a>
    </nav>
    <header>
      <p class="eyebrow">MATRIX COPILOT</p>
      <h1>社媒矩阵草稿助手</h1>
      <p>创作和回复走两套流程。系统返回带评理、证据和硬门降级的草稿包，P0 不发送到任何渠道。</p>
    </header>
    <section class="composer">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-scenario="compose" role="tab" aria-selected="true">写帖</button>
        <button type="button" class="tab" data-scenario="reply" role="tab" aria-selected="false">回评</button>
      </div>
      <div id="composeForm" class="fields">
        <textarea id="composeText" rows="4">为秋季上新写一条预热推文，口径可核验，不承诺收益或疗效。</textarea>
        <div class="field-row">
          <span class="field-label">平台</span>
          <label class="check"><input type="checkbox" name="platform" value="x-twitter" checked> X / Twitter</label>
          <label class="check"><input type="checkbox" name="platform" value="weibo"> 微博</label>
        </div>
        <label class="check">
          <input type="checkbox" id="needTrends"> 需要爆款趋势（P0 失败则记 limitation，不失败整单）
        </label>
      </div>
      <div id="replyForm" class="fields" hidden>
        <textarea id="replyText" rows="3">处理样例线程评论，先判断该不该回，再写草稿。</textarea>
        <label class="field">
          <span class="field-label">线程</span>
          <input id="threadKey" value="demo-1" spellcheck="false">
        </label>
        <p class="hint">demo-1 含 3 条评论，其中 1 条攻击。攻击项应 skip 且正文为空。</p>
      </div>
      <button id="submit">生成草稿包</button>
    </section>
    <section id="progress" class="panel" hidden>
      <h2>执行进度</h2>
      <ol id="events"></ol>
    </section>
    <section id="package" class="panel" hidden>
      <h2>草稿包</h2>
      <p id="summary" class="lede"></p>
      <p id="packageMeta" class="meta"></p>
      <div id="drafts" class="draft-grid"></div>
      <h3>证据卡片</h3>
      <ul id="evidence"></ul>
      <h3>限制说明</h3>
      <ul id="limitations"></ul>
      <p id="snapshot" class="meta"></p>
    </section>
    <section id="error" class="panel error" hidden></section>
  </main>
  <script src="/static/matrix.js"></script>
</body>
</html>
